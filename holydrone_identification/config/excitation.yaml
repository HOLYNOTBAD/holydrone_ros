# Local hover identification; all time intervals use ROS/simulation time.
frequency: 50.0
hover_source: feedback  # Median FCU ATTITUDE_TARGET thrust during stable position hold.
hover_thrust: 0.24  # Initial guess only. Verify for the selected aircraft before excitation.
rate_amplitudes: [0.20, 0.20, 0.25]
thrust_amplitude: 0.015
pulse_hold: 0.35
baseline_seconds: 0.3
repetitions: 3
recovery_seconds: 2.0
settle_seconds: 1.0
position_tolerance: 0.15
speed_tolerance: 0.15
rate_tolerance: 0.15
tilt_tolerance: 0.12
max_radius: 1.0
max_tilt: 0.35
min_z: 0.5
max_z: 3.5
feedback_timeout: 0.3
state_timeout: 2.0
max_session_seconds: 180.0
seed: 100
# Real flight is passive by default. Enable only after measured bounds are set.
enable_real_excitation: false
auto_takeoff: false
takeoff_height: 2.0
